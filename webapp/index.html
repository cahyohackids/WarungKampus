<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WarungKampus - Mini App</title>
    <!-- Telegram Web App JS SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div id="app">
        <div class="screens-container">
            
            <!-- SCREEN: CATALOG -->
            <div id="screen-catalog" class="screen active">
                <!-- Header Profile (Small) -->
                <header class="header card-glass">
                    <div class="user-info">
                        <div class="avatar-placeholder" id="user-avatar-sm">
                            <span id="user-initial-sm">U</span>
                        </div>
                        <div class="user-details">
                            <h2 id="user-name-sm">Memuat...</h2>
                            <p id="user-balance-sm" class="balance text-gradient">Saldo: Rp 0</p>
                        </div>
                    </div>
                </header>

                <!-- Categories Menu -->
                <section class="categories-section">
                    <div class="categories-scroll" id="category-list">
                        <button class="cat-btn active">Loading...</button>
                    </div>
                </section>

                <!-- Catalog Products -->
                <main class="catalog-section">
                    <div class="products-grid" id="product-list">
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                    </div>
                </main>
            </div>

            <!-- SCREEN: HISTORY -->
            <div id="screen-history" class="screen">
                <header class="screen-header">
                    <h2>🧾 Riwayat Transaksi</h2>
                </header>
                <div class="history-list" id="history-container">
                    <p style="text-align:center; color:var(--text-secondary); margin-top:20px;">Memuat data...</p>
                </div>
            </div>

            <!-- SCREEN: PROFILE -->
            <div id="screen-profile" class="screen">
                <header class="screen-header">
                    <h2>👤 Profil Saya</h2>
                </header>
                
                <div class="profile-card card-glass">
                    <div class="avatar-large" id="profile-avatar">U</div>
                    <h2 id="profile-name" class="profile-name">Memuat...</h2>
                    <p id="profile-id" class="profile-id">ID: -</p>
                    
                    <div class="balance-box">
                        <span class="label">Total Saldo Tersedia</span>
                        <h3 id="profile-balance" class="amount text-gradient">Rp 0</h3>
                    </div>
                    
                    <button id="btn-topup-profile" class="btn-primary w-full shadow-glow">💳 Isi Saldo (Topup)</button>
                </div>
                
                <div class="help-section card-glass" style="margin-top:20px; font-size:14px; color:var(--text-secondary)">
                    <p>Butuh bantuan? Silakan hubungi admin bot atau klik tombol bantuan di menu bot Telegram Anda.</p>
                </div>
            </div>
            
        </div>
        
        <!-- Bottom padding for nav and cart -->
        <div class="bottom-padding"></div>
        
        <!-- Bottom Navigation -->
        <nav class="bottom-nav card-glass">
            <button class="nav-item active" data-tab="catalog" onclick="switchTab('catalog')">
                <span class="nav-icon">🛍️</span>
                <span class="nav-text">Katalog</span>
            </button>
            <button class="nav-item" data-tab="history" onclick="switchTab('history')">
                <span class="nav-icon">🧾</span>
                <span class="nav-text">Riwayat</span>
            </button>
            <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Profil</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
